name: UniHack Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Backend Test Suite & Hard Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio

      - name: Run 5-Tier Automated Test Suite (306 Tests)
        run: |
          pytest tests/ -v

      - name: Execute Full 1,000-Item Pipeline Benchmark
        run: |
          python -m src.benchmark.evaluator --input "Unihack_ Sample Dataset - Input.csv" --ground-truth "Unihack_ Expected Output - Delivery Format.csv"

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Dependencies & Build Frontend
        working-directory: src/frontend
        run: |
          npm ci
          npm run build

  docker-build:
    name: Docker Image Build & Validation
    runs-on: ubuntu-latest
    needs: [test-and-verify, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: unilog-pim-intelligence:latest
