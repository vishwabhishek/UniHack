[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unilog-pim-intelligence"
version = "1.0.0"
description = "Enterprise Industrial Product Intelligence & PIM Pipeline for UniHack 2026"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Abhishek Vishwakarma" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "python-dateutil>=2.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "playwright>=1.40.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
