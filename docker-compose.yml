version: '3.8'

services:
  unilog-pim:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unilog-pim-intelligence
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data/output:/app/data/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
